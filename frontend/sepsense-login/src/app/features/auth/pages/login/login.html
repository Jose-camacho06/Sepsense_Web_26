<div class="page">
  <div class="card">
    <h1 class="title">Inicio de Sesión</h1>

    <form [formGroup]="form" (ngSubmit)="ingresar()" class="form">
      <input formControlName="user" class="input" placeholder="Ingresa tu usuario" />
      <input formControlName="password" class="input" type="password" placeholder="Ingresa tu contraseña" />

      <div class="links">
        <button type="button" class="link_button" (click)="irOlvideContrasena()">Olvidé mi contraseña</button>
        <button type="button" class="link_button" (click)="irRegistro()">Registrarse</button>
      </div>

      <button type="button" class="login_button" (click)="ingresar()">Ingresar</button>
      
    </form>
  </div>
</div>
