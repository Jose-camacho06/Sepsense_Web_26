<div class="page">
  <div class="card">
    @if (step === 1) {
      <form [formGroup]="emailForm" (ngSubmit)="enviarCodigo()" class="form">
        <button type="button" class="register_button" (click)="irRegistro()">Registrarse</button>
        <h2 class="title">Recuperar contraseña</h2>
        <p class="hint">Escribe tu correo y te enviaremos un código de 6 dígitos.</p>
        <input formControlName="email" type="email" class="input" placeholder="Ingresa tu correo electrónico" />
        <button type="submit" class="Recover_button" [disabled]="loading">
          {{ loading ? 'Enviando...' : 'Enviar código' }}
        </button>
      </form>
    } @else {
      <form [formGroup]="resetForm" (ngSubmit)="cambiarContrasena()" class="form">
        <button type="button" class="register_button" (click)="irRegistro()">Registrarse</button>
        <h2 class="title">Nueva contraseña</h2>
        <p class="hint">Código enviado a {{ email }}</p>
        <input formControlName="codigo" type="text" inputmode="numeric" maxlength="6" class="input" placeholder="Código de 6 dígitos" />

 <div class="password-field">
  <input formControlName="nuevaContrasena" [type]="showPassword ? 'text' : 'password'" class="input" placeholder="Nueva contraseña (mínimo 8)" />
  <button type="button" class="eye" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
    <app-eye-icon [open]="showPassword" />
  </button>
</div>

<div class="password-field">
  <input formControlName="confirmarContrasena" [type]="showConfirm ? 'text' : 'password'" class="input" placeholder="Confirma tu nueva contraseña" />
  <button type="button" class="eye" (click)="showConfirm = !showConfirm" [attr.aria-label]="showConfirm ? 'Ocultar contraseña' : 'Mostrar contraseña'">
    <app-eye-icon [open]="showConfirm" />
  </button>
</div>

        <button type="submit" class="Recover_button" [disabled]="loading">
          {{ loading ? 'Guardando...' : 'Cambiar' }}
        </button>
        <div class="links">
          <button type="button" class="link_button" (click)="reenviarCodigo()">Reenviar código</button>
          <button type="button" class="link_button" (click)="volver()">Cambiar correo</button>
        </div>
      </form>
    }

    @if (message) {
      <p class="hint">{{ message }}</p>
    }
  </div>
</div>
