<div class="page">
  <div class="card">
    <form [formGroup]="form" (ngSubmit)="ingresar()" class="form">
        <h2 class="title">Recuperar Contraseña</h2>
        <input formControlName="email" class="input" placeholder="Ingresa tu correo electrónico" />

        <h2 class="title">Ingresar Código</h2>
        <input formControlName="codigo" class="input" type="password" placeholder="Ingresa tu código de recuperación" />
        
        <button type="button" class="link_button" (click)="irRegistro()">Registrarse</button>
        <button type="button" class="Recover_button" (click)="ingresar()">Ingresar</button>

    </form>
  </div>
</div>
